 <div id="studio-intro" class="si-wait" aria-label="Studio383" role="img"><span class="si-glow"></span><span class="si-line"></span><div class="si-row"><img class="si-word" src="./ui/studio383/studio.webp" alt="" draggable="false"><img class="si-num" src="./ui/studio383/383.webp" alt="" draggable="false"></div></div>
 <script>(function(){var r=document.getElementById('studio-intro');if(!r)return;var skip=false;try{skip=sessionStorage.getItem('gd-skip-intro')==='1'||localStorage.getItem('gd-nointro')==='1';sessionStorage.removeItem('gd-skip-intro');}catch(e){}if(skip||/[?&]google/.test(location.search)){r.remove();return;}
  // Açılış sesi: önce kendiliğinden çalmayı dener; telefon izin vermezse ilk dokunuşta animasyonun o anki yerinden başlar.
  // Dokunmak açılışı GEÇMEZ (kullanıcı isteği). Ayarlarda ses efektleri kapalıysa çalmaz.
  // Açılış: önce ekran kısa süre siyah kalır; logo görselleri ve ses yüklenince animasyon sesle birlikte baştan başlar (en çok 2,5 sn beklenir).
  var t0=performance.now(),vol=.7;try{var st=localStorage.getItem('gd-sound');if(st==='0')vol=0;}catch(e){}
  var url='./ui/studio383/intro.mp3',snd=new Audio(url),playing=false,started=false;snd.preload='auto';snd.volume=vol;try{snd.load();}catch(e){}
  var tryPlay=function(fromTap){if(!begun||playing||vol<=0)return;var at=(performance.now()-t0)/1000;if(fromTap&&at>3.5)return;
   try{if(fromTap&&at>.15)snd.currentTime=Math.max(0,at-.05);
    var p=snd.play();if(p&&p.then)p.then(function(){playing=true;},function(){playing=false;});else playing=true;}catch(e){}};
  var gone=false,done=function(){if(gone)return;gone=true;r.remove();window.__gdStudioDone=true;try{window.dispatchEvent(new Event('gd:studio-done'));}catch(e){}};
  // Ses gerçekten çalmaya başlayınca (playing) animasyon başlar; ses engellenirse ya da gecikirse en çok 1,2 sn beklenir.
  var begun=false,begin=function(){if(begun)return;begun=true;t0=performance.now();r.classList.remove('si-wait');setTimeout(done,4700);};
  var start=function(){if(started)return;started=true;if(vol<=0){begin();return;}
   snd.addEventListener('playing',function(){begin();},{once:true});
   try{snd.currentTime=0;var p=snd.play();if(p&&p.then)p.then(function(){playing=true;},function(){playing=false;begin();});else playing=true;}catch(e){begin();}
   setTimeout(begin,1200);};
  var waits=[].slice.call(r.querySelectorAll('img')).map(function(img){return img.decode?img.decode().catch(function(){}):Promise.resolve();});
  // Telefon açılış ekranından sonra en az 1 sn siyah: animasyonun başı kaçmasın.
  waits.push(new Promise(function(res){setTimeout(res,1000);}));
  if(vol>0)waits.push(new Promise(function(res){if(snd.readyState>=3)return res();snd.addEventListener('canplaythrough',res,{once:true});snd.addEventListener('loadeddata',function(){setTimeout(res,150);},{once:true});snd.addEventListener('error',res,{once:true});}));
  Promise.all(waits).then(start);setTimeout(start,2500);
  r.addEventListener('pointerdown',function(){tryPlay(true);});
